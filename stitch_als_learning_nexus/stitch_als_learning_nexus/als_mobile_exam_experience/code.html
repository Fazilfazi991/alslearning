<script>
        // Option Selection Logic
        document.querySelectorAll('.option-card').forEach(card => {
            card.addEventListener('click', function() {
                // Reset all
                document.querySelectorAll('.option-card').forEach(c => {
                    c.classList.remove('selected', 'bg-[rgba(42,67,127,0.05)]', 'border-status-answered', 'border-2');
                    c.classList.add('border-surface-dim', 'border');
                    const icon = c.querySelector('.material-symbols-outlined[data-icon="check_circle"]');
                    if(icon) icon.remove();
                });
                
                // Set selected
                this.classList.add('selected', 'bg-[rgba(42,67,127,0.05)]');
                this.classList.remove('border-surface-dim', 'border');
                this.classList.add('border-status-answered', 'border-2');
                
                // Add icon
                if(!this.querySelector('.material-symbols-outlined')) {
                    const icon = document.createElement('span');
                    icon.className = 'material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-status-answered';
                    icon.setAttribute('data-icon', 'check_circle');
                    icon.textContent = 'check_circle';
                    this.appendChild(icon);
                }
            });
            
            // Keyboard accessibility for options
            card.addEventListener('keypress', function(e) {
                if(e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    this.click();
                }
            });
        });

        // Bottom Sheet Logic
        const sheet = document.getElementById('navigatorSheet');
        const openBtn = document.getElementById('openNavigatorBtn');
        const closeBtn = document.getElementById('closeNavigatorBtn');
        const backdrop = document.getElementById('navigatorBackdrop');

        function toggleSheet() {
            if (sheet.classList.contains('hidden')) {
                sheet.classList.remove('hidden');
                document.body.style.overflow = 'hidden';
            } else {
                sheet.classList.add('hidden');
                document.body.style.overflow = '';
            }
        }

        openBtn.addEventListener('click', toggleSheet);
        closeBtn.addEventListener('click', toggleSheet);
        backdrop.addEventListener('click', toggleSheet);
    </script>
