services:
  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: local-registration-test-only
      POSTGRES_DB: gotrue
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gotrue"]
      interval: 2s
      timeout: 2s
      retries: 30
  mail:
    image: public.ecr.aws/supabase/mailpit:v1.31.3
    ports:
      - "127.0.0.1:19425:8025"
  auth:
    image: public.ecr.aws/supabase/gotrue:v2.197.0
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:19421:9999"
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://127.0.0.1:19421
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:local-registration-test-only@db:5432/gotrue?search_path=auth
      GOTRUE_SITE_URL: http://127.0.0.1:19422
      GOTRUE_URI_ALLOW_LIST: http://127.0.0.1:19422/**
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_SECRET: this-is-a-disposable-local-only-registration-secret-123456
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_SMTP_HOST: mail
      GOTRUE_SMTP_PORT: 1025
      GOTRUE_SMTP_ADMIN_EMAIL: noreply@example.test
      GOTRUE_SMTP_SENDER_NAME: Local Test
      GOTRUE_MAILER_URLPATHS_INVITE: /verify
